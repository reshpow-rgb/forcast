name: ASX Value Finder (Android)

on:
  push:
    paths:
      - "asx-value/**"
      - ".github/workflows/asx-value-android.yml"
  pull_request:
    paths:
      - "asx-value/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asx-value
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: asx-value-finder-apk
          path: asx-value/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
